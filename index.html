<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1A19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Portaria · Grupo Farias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B1A19; --ink-2:#34322F;
  --gold:#BF9A41; --gold-hi:#E9CB74; --gold-deep:#7E5F16; --gold-soft:#F4ECD0;
  --paper:#FFFFFF; --ground:#EEEDEA; --line:#D6D2C8; --mute:#5E5A52;
  --alert:#B3261E; --alert-soft:#FBE9E7; --ok:#2B6A3D;
  --f-head:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{min-height:100dvh;display:flex;flex-direction:column}

/* Cabeçalho */
.top{position:sticky;top:0;z-index:20;background:#fff;padding-top:env(safe-area-inset-top,0px)}
.brand{display:flex;align-items:center;gap:12px;padding:8px 14px}
.brand img{height:46px;width:auto;display:block}
.brand .where{font-family:var(--f-head);font-weight:600;font-size:21px;line-height:1;border-left:2px solid var(--gold);padding-left:12px;flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;min-height:32px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.chip.pend .dot{background:var(--gold)} .chip.off .dot,.chip.err .dot{background:var(--alert)} .chip.demo .dot{background:var(--gold-deep)}
.rule{height:3px;background:linear-gradient(90deg,#7E5F16,#E9CB74 38%,#BF9A41 68%,#7E5F16)}
.who{background:var(--ink);color:#EDEAE2;font-size:13px;display:flex;justify-content:space-between;align-items:center;padding:4px 14px;min-height:34px}
.who button{background:none;border:0;color:var(--gold-hi);font-weight:600;padding:6px 0 6px 12px;text-decoration:underline;text-underline-offset:3px}

/* Corpo */
main{flex:1;padding:16px 14px 24px;width:100%;max-width:640px;margin:0 auto}
h1{font-family:var(--f-head);font-weight:700;font-size:30px;line-height:1.05;margin:0}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.count{font-family:var(--f-head);font-weight:700;font-size:22px;background:var(--ink);color:var(--gold-hi);border-radius:5px;min-width:38px;text-align:center;padding:1px 10px}
.backrow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{background:#fff;border:2px solid var(--ink);border-radius:6px;min-height:44px;padding:0 14px;font-weight:600}
.muted{color:var(--mute)}
.notice{background:var(--gold-soft);border-left:5px solid var(--gold);padding:10px 12px;border-radius:4px;font-size:15px;margin:0 0 14px}
.notice.bad{background:var(--alert-soft);border-left-color:var(--alert)}

/* Placa */
.plate{position:relative;display:inline-block;font-family:var(--f-head);font-weight:700;font-size:24px;letter-spacing:.09em;background:#fff;color:var(--ink);border:2px solid var(--ink);border-top:9px solid var(--ink);border-radius:5px;padding:0 9px;line-height:1.2;white-space:nowrap}
.plate::before{content:"";position:absolute;left:0;right:0;top:-6px;height:2px;background:var(--gold)}

/* Lista */
.search{width:100%;min-height:50px;border:2px solid var(--line);border-radius:6px;padding:10px 12px;font:inherit;font-size:17px;background:#fff;margin-bottom:12px}
.search:focus,.field input:focus,.field textarea:focus{border-color:var(--gold);outline:0;box-shadow:0 0 0 3px var(--gold-soft)}
.veh{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:0;border-left:5px solid var(--gold);border-radius:4px;padding:12px;margin-bottom:8px;box-shadow:0 1px 0 var(--line)}
.veh.flag{border-left-color:var(--alert)}
.veh-main{flex:1;min-width:0;display:flex;flex-direction:column}
.veh-main strong{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.veh-main small{color:var(--mute);font-size:14px}
.veh-go{font-family:var(--f-head);font-weight:700;font-size:19px;color:var(--gold-deep);border:2px solid var(--gold);border-radius:5px;padding:4px 12px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:4px;padding:1px 7px;background:var(--alert);color:#fff;margin-left:6px}
.tag.stale{background:var(--gold-deep)}
.veh.stale{border-left-color:var(--gold-deep)}
.notice.warn2{background:var(--gold-soft);border-left:5px solid var(--gold-deep);padding:12px;border-radius:4px;margin:0 0 14px}
.notice.warn2 .btn{margin-top:10px}
.empty{background:#fff;border-radius:6px;padding:22px 16px;text-align:center;color:var(--mute)}
.empty .btn{margin-top:14px}

/* Formulário */
.field{margin-bottom:16px}
.field>label,.lbl{display:block;font-weight:600;font-size:14px;margin:0 0 5px}
.field input,.field textarea{width:100%;min-height:50px;border:2px solid var(--line);border-radius:6px;padding:10px 12px;font:inherit;font-size:17px;background:#fff}
.field textarea{min-height:84px;resize:vertical}
.plate-input{font-family:var(--f-head)!important;font-size:36px!important;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:#fff}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{min-height:50px;background:#fff;border:0;font-family:var(--f-head);font-weight:600;font-size:20px}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--gold-hi)}
.seg.warn button[aria-pressed=true]{background:var(--alert);color:#fff}
.sect{font-family:var(--f-head);font-weight:700;font-size:22px;margin:22px 0 8px}

/* Fotos */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;aspect-ratio:3/4;border:2px dashed var(--gold-deep);background:var(--gold-soft);color:var(--gold-deep);border-radius:6px;overflow:hidden;font-weight:600;font-size:14px;padding:4px}
.slot-btn.has{border:2px solid var(--ink);padding:0}
.slot-btn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .name{display:block;text-align:center;font-family:var(--f-head);font-weight:600;font-size:18px;margin-top:5px}
.mini{display:block;margin:2px auto 0;background:none;border:0;color:var(--gold-deep);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:36px}
.slot input[type=file]{display:none}
svg.ic{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Comparação entrada × saída */
.pair{margin-bottom:16px}
.pair h3{font-family:var(--f-head);font-weight:700;font-size:21px;margin:0 0 6px}
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frame{position:relative;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:#D9D6CE;border:2px solid var(--ink);padding:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--mute);width:100%}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .cap{position:absolute;left:0;right:0;top:0;background:rgba(27,26,25,.82);color:var(--gold-hi);font-size:12px;font-weight:600;padding:3px 8px;text-align:left}
.frame.new{border:2px dashed var(--gold-deep);background:var(--gold-soft);color:var(--gold-deep);font-weight:600;flex-direction:column;gap:4px;font-size:14px}
.frame.new.has{border:2px solid var(--gold-deep)}
.summary{background:#fff;border-left:5px solid var(--ink);border-radius:4px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:16px}
.summary .veh-main strong{white-space:normal}

dl.info{background:#fff;border-radius:6px;padding:4px 14px;margin:0 0 14px}
dl.info div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line)}
dl.info div:last-child{border-bottom:0}
dl.info dt{color:var(--mute);font-size:14px} dl.info dd{margin:0;font-weight:600;text-align:right}

/* Barras inferiores */
.dock{position:sticky;bottom:0;z-index:20;background:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.actions{background:#fff;padding:10px 14px;border-top:3px solid var(--gold);display:flex;gap:10px}
.actions .btn{max-width:640px;margin:0 auto}
.tabs{display:grid;grid-template-columns:1fr 1fr}
.tabs button{background:none;border:0;border-top:4px solid transparent;color:#CFCBC0;min-height:56px;font-family:var(--f-head);font-weight:600;font-size:20px}
.tabs button[aria-current=page]{color:var(--gold-hi);border-top-color:var(--gold)}
.btn{min-height:54px;border:0;border-radius:6px;font-family:var(--f-head);font-weight:700;font-size:23px;letter-spacing:.02em;padding:0 20px;width:100%}
.btn.primary{background:linear-gradient(180deg,#E6C96F,#BF9A41);color:var(--ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.btn.dark{background:var(--ink);color:var(--gold-hi)}
.btn.ghost{background:#fff;border:2px solid var(--ink)}
.btn:disabled{opacity:.5}

/* Toast e visualizador */
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;border-left:5px solid var(--gold);padding:12px 16px;border-radius:5px;max-width:calc(100% - 28px);width:max-content;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;font-weight:500}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-left-color:var(--alert);background:#3A1512}
.viewer{position:fixed;inset:0;background:rgba(10,9,8,.96);z-index:80;display:flex;flex-direction:column}
.viewer-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;color:#fff}
.viewer-bar strong{font-family:var(--f-head);font-size:22px;color:var(--gold-hi)}
.viewer-bar button{background:var(--gold);border:0;border-radius:6px;min-height:44px;padding:0 16px;font-weight:600;color:var(--ink)}
.viewer-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pan-x pan-y pinch-zoom}
.viewer-body img{max-width:100%;max-height:100%;object-fit:contain}
.viewer-body.zoom{display:block}
.viewer-body.zoom img{max-width:none;max-height:none;width:240%}
.login{background:#fff;border-radius:6px;padding:20px 16px;border-top:5px solid var(--gold);margin-top:8px}
.login h1{margin-bottom:6px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const nowStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const parseT = s => new Date(String(s).replace(' ', 'T'));
const fmtHora = s => s ? String(s).substring(11, 16) : '';
const fmtData = s => s ? `${String(s).substring(8,10)}/${String(s).substring(5,7)}` : '';
const fmtDH = s => s ? `${fmtData(s)} ${fmtHora(s)}` : '';
const fmtFull = s => `${String(s).substring(8,10)}/${String(s).substring(5,7)}/${String(s).substring(0,4)} ${String(s).substring(11,19)}`;
const minutosDesde = s => Math.max(0, Math.round((Date.now() - parseT(s)) / 60000));
const dur = s => { const m = minutosDesde(s); return m < 60 ? `${m} min` : `${Math.floor(m/60)}h${pad(m%60)}`; };
const uid = p => `${p}-${nowStr().replace(/[^0-9]/g,'')}-${Math.random().toString(36).slice(2,6)}`;
const TIPOS = { funcionario:'Funcionário', terceiro:'Terceiro', visitante:'Visitante' };
const TIPOS_VEIC = { carro:'Carro', caminhao:'Caminhonete/Caminhão' };
const PARADO_ALERTA_MIN = 18 * 60; // 18h — destaque de "parado há muito tempo" na lista
function labelPorta(tipoVeic) { return tipoVeic === 'caminhao' ? 'Carroceria' : 'Porta-malas'; }
function fotosDe(tipoVeic) { return [['placa','Placa'], ['porta', labelPorta(tipoVeic)]]; }
function tipoVeicDe(d) { return (d && d.rec && d.rec.tipoVeiculo) || (d && d.tipoVeic) || 'carro'; }
function fotosLabel(d, k) { if (k === 'liberacao') return 'Liberação'; return k === 'placa' ? 'Placa' : labelPorta(tipoVeicDe(d)); }
const ICON_CAM = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>';

function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 3600);
}

/* ===================================================================
   Banco local (IndexedDB): fila de envio, veículos no pátio, histórico
   =================================================================== */
const DB = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('portaria-farias', 1);
    r.onupgradeneeded = () => { ['outbox','open','done'].forEach(n => r.result.createObjectStore(n, { keyPath:'id' })); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode); const rq = fn(t.objectStore(store));
      t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  };
  return {
    all: s => tx(s, 'readonly', o => o.getAll()),
    put: (s, v) => tx(s, 'readwrite', o => o.put(v)),
    del: (s, k) => tx(s, 'readwrite', o => o.delete(k))
  };
})();

async function loadLocal() {

  S.done = (await DB.all('done')).sort((a, b) => String(b.saidaEm).localeCompare(String(a.saidaEm)));

/* ===================================================================
   API (Apps Script)
   =================================================================== */
async function api(action, data = {}, timeoutMs = 60000) {
  if (DEMO) throw Object.assign(new Error('Modo teste'), { network: true });
  const ctl = new AbortController(); const h = setTimeout(() => ctl.abort(), timeoutMs);
  let r;
  try {
    r = await fetch(CONFIG.SCRIPT_URL, {
      method: 'POST', redirect: 'follow', signal: ctl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },      // evita preflight de CORS
      body: JSON.stringify({ token: CONFIG.TOKEN, action, ...data })
    });
  } catch (e) { throw Object.assign(new Error('Sem conexão com o servidor'), { network: true }); }
  finally { clearTimeout(h); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Resposta inválida do servidor. Confira a URL e a implantação do Apps Script.'); }
  if (!j.ok) throw new Error(j.error || 'Erro no servidor');
  return j;
}

/* ===================================================================
   Sincronização (fila offline)
   =================================================================== */
let syncing = false;
async function sync(manual) {
  if (DEMO) { if (manual) toast('Modo teste: nada é enviado. Configure a URL no index.html.'); return; }
  if (syncing) return;
  if (!navigator.onLine) { if (manual) toast('Sem sinal. Os registros ficam guardados no celular.', true); paintSync(); return; }
  syncing = true; let enviados = 0;
  try {
    const items = (await DB.all('outbox')).sort((a, b) => a.createdAt - b.createdAt);
    for (const it of items) {
      try { await api(it.type, it.payload); await DB.del('outbox', it.id); enviados++; }
      catch (e) {
        if (e.network) break;                                   // sem rede: tenta depois, mantém a ordem
        it.lastError = e.message; await DB.put('outbox', it);    // erro do servidor: marca e segue
        if (manual) toast('Erro ao enviar: ' + e.message, true);
      }
    }
  } finally { syncing = false; }
  await refreshOpen();
  await loadLocal();
  if (manual && enviados) toast(`${enviados} registro(s) enviado(s)`);
  else if (manual && !S.pend) toast('Tudo sincronizado');
}

async function refreshOpen() {
  if (DEMO || !navigator.onLine) return;
  try {
    const r = await api('list_open', {}, 30000);
    const ob = await DB.all('outbox');
    const pendEntr = new Set(ob.filter(o => o.type === 'entrada').map(o => o.payload.id));
    const pendSaida = new Set(ob.filter(o => o.type === 'saida').map(o => o.payload.id));
    const local = await DB.all('open');
    const localIds = new Set(local.map(x => x.id)); const srv = new Set(r.itens.map(x => x.id));
    for (const it of r.itens) if (!localIds.has(it.id) && !pendSaida.has(it.id)) await DB.put('open', it);
    for (const l of local) if (!srv.has(l.id) && !pendEntr.has(l.id)) await DB.del('open', l.id);
    await loadLocal();
    if (S.screen === 'home') paintList();
  } catch (e) { /* offline ou erro: segue com o que tem local */ }
}

function paintSync() {
  const c = $('#syncChip'), t = $('#syncTxt'); if (!c) return;
  let cls = 'chip', txt = 'Sincronizado';
  if (DEMO) { cls += ' demo'; txt = 'Modo teste'; }
  else if (S.err) { cls += ' err'; txt = `${S.err} com erro`; }
  else if (!navigator.onLine) { cls += ' off'; txt = S.pend ? `Sem sinal · ${S.pend} na fila` : 'Sem sinal'; }
  else if (S.pend) { cls += ' pend'; txt = `${S.pend} na fila`; }
  c.className = cls; t.textContent = txt;
}

function validateForm() {

  if (!/^[A-Z0-9]{6,7}$/.test(d.placa)) return 'Placa inválida: use 6 ou 7 letras/números';

  return null;
}
async function saveForm() {
  const d = S.draft; const err = validateForm(); if (err) return toast(err, true);
  if (busy) return; busy = true;
  try {
    const base = { portaria: CONFIG.PORTARIA, tipo: d.tipo, tipoVeiculo: d.tipoVeic, ident: d.ident.trim(), documento: d.tipo === 'funcionario' ? '' : d.documento.trim(), placa: d.placa };
    if (d.kind === 'entrada') {
      const id = uid('E'), t = nowStr();
      const payload = { id, ...base, vig: S.vig, entradaEm: t, obs: d.obs.trim(), fotos: d.fotos };
      await DB.put('open', { id, ...base, vigEntrada: S.vig, entradaEm: t, obsEntrada: d.obs.trim(), status: 'No pátio', fotos: d.fotos });
      await DB.put('outbox', { id: 'o-' + id, type: 'entrada', createdAt: Date.now(), payload });
      toast(`Entrada registrada: ${d.placa}`);
    } else {
      const id = uid('S'), t = nowStr();
      const payload = { id, ...base, vig: S.vig, saidaEm: t, semEntrada: true, divergencia: false, obs: d.obs.trim(), fotos: d.fotos };
      await DB.put('outbox', { id: 'o-' + id, type: 'saida', createdAt: Date.now(), payload });

      toast(`Saída registrada: ${d.placa}`);

    <div class="summary"><span class="plate">${esc(r.placa)}</span>
      <span class="veh-main"><strong>${esc(r.ident)}</strong>
      <small>${esc(TIPOS[r.tipo] || r.tipo)}${r.documento ? ' · ' + esc(r.documento) : ''}<br>Entrou ${fmtDH(r.entradaEm)} · há ${dur(r.entradaEm)}${r.vigEntrada && r.vigEntrada.nome ? ' · ' + esc(r.vigEntrada.nome) : ''}</small></span></div>
    ${r.obsEntrada ? `<p class="notice"><b>Obs. da entrada:</b> ${esc(r.obsEntrada)}</p>` : ''}
    <div class="sect" style="margin-top:0">Entrada × saída</div>
    <div id="pairs">${fotosDe(r.tipoVeiculo).map(([k, l]) => pairHTML(k, l)).join('')}</div>
    <div class="sect">Liberação de material</div>
    <div class="seg two" role="group" aria-label="Saída com material">
      <button type="button" data-act="liber" data-v="nao" aria-pressed="${d.liber === 'nao'}">Não</button>
      <button type="button" data-act="liber" data-v="sim" aria-pressed="${d.liber === 'sim'}">Sim, com material</button></div>
    ${d.liber === 'sim' ? `<p class="notice">Fotografe o documento de liberação (não precisa fotografar o material em si).</p>
      <div class="slots" style="grid-template-columns:1fr;max-width:220px;margin:10px 0 4px">${slotHTML('liberacao', 'Liberação', d.fotos.liberacao)}</div>` : ''}
    <div class="sect">Conferência</div>
    <div class="seg two warn" role="group" aria-label="Divergência">
      <button type="button" data-act="diverg" data-v="nao" aria-pressed="${d.diverg === 'nao'}" style="${d.diverg === 'nao' ? 'background:var(--ok);color:#fff' : ''}">Sem divergência</button>
      <button type="button" data-act="diverg" data-v="sim" aria-pressed="${d.diverg === 'sim'}">Há divergência</button></div>
    <div class="field" style="margin-top:14px"><label for="obs">Observação ${d.diverg === 'sim' ? '(obrigatória)' : '(opcional)'}</label>
      <textarea id="obs" data-bind="obs" placeholder="${d.diverg === 'sim' ? 'Descreva o que mudou entre a entrada e a saída' : 'Opcional'}">${esc(d.obs)}</textarea></div>`;
  $('#dock').innerHTML = actionBar('<button class="btn primary" data-act="save-saida" type="button">Registrar saída</button>');
}
async function saveSaida() {
  const d = S.draft; if (busy) return;
  for (const [k, l] of fotosDe(d.rec.tipoVeiculo)) if (!d.fotos[k]) return toast(`Falta a foto de saída: ${l}`, true);
  if (d.liber === 'sim' && !d.fotos.liberacao) return toast('Falta a foto da liberação de material', true);
  if (!d.diverg) return toast('Marque “Sem divergência” ou “Há divergência”', true);
  if (d.diverg === 'sim' && d.obs.trim().length < 5) return toast('Descreva a divergência na observação', true);
  busy = true;
  try {
    const r = d.rec, t = nowStr(), div = d.diverg === 'sim';
    const payload = { id: r.id, portaria: CONFIG.PORTARIA, placa: r.placa, vig: S.vig, saidaEm: t, divergencia: div, obs: d.obs.trim(), liberacaoMaterial: d.liber === 'sim', fotos: d.fotos };
    await DB.put('outbox', { id: 'o-S-' + r.id, type: 'saida', createdAt: Date.now(), payload });
    const { fotos, ...semFotos } = r;
    await addDone({ ...semFotos, status: 'Saiu', saidaEm: t, vigSaida: S.vig, divergencia: div, obsSaida: d.obs.trim(), liberacaoMaterial: d.liber === 'sim' });
    await DB.del('open', r.id);
    toast(div ? `Saída com divergência registrada: ${r.placa}` : `Saída registrada: ${r.placa}`);
    S.draft = null; S.q = ''; await loadLocal(); go('home', {}, false); sync();
  } catch (e) { toast('Não foi possível salvar no celular: ' + e.message, true); }
  finally { busy = false; }
}

/* ===================================================================
   Histórico e detalhe
   =================================================================== */
function renderHist() {
  $('#main').innerHTML = `<div class="titlebar"><h1>Histórico</h1></div>
    <input class="search" id="hq" placeholder="Buscar placa, nome ou data" value="${esc(S.hq)}" autocomplete="off" autocapitalize="characters">
    <div id="hlist"></div>`;
  $('#dock').innerHTML = tabs('hist');
  loadHist();
}
let hTimer;
async function loadHist() {
  const q = S.hq.trim(); const box = $('#hlist'); if (box) box.innerHTML = '<div class="empty">Carregando…</div>';
  const local = [...S.open, ...S.done].filter(r => !q || [r.placa, r.ident, r.documento, r.entradaEm, r.saidaEm].join(' ').toLowerCase().includes(q.toLowerCase()));
  let items = null;
  if (!DEMO && navigator.onLine) {
    try {
      const r = await api('historico', { q, limit: 60 }, 30000); items = r.itens;
      const ob = await DB.all('outbox'); const pend = new Set(ob.map(o => o.payload.id)); const have = new Set(items.map(i => i.id));
      items = [...local.filter(l => pend.has(l.id) && !have.has(l.id)), ...items];
    } catch (e) { /* cai para o local */ }
  }
  S.hist = (items || local.sort((a, b) => String(b.saidaEm || b.entradaEm).localeCompare(String(a.saidaEm || a.entradaEm))));
  if (S.screen === 'hist') paintHist(!items);
}
function paintHist(offline) {
  const box = $('#hlist'); if (!box) return;
  const note = offline && !DEMO ? '<p class="notice">Mostrando só o que está neste celular (sem conexão com o servidor).</p>' : '';
  if (!S.hist.length) { box.innerHTML = note + '<div class="empty">Nenhum registro encontrado.</div>'; return; }
  box.innerHTML = note + S.hist.map(r => {
    const dentro = r.status === 'No pátio';
    return `<button class="veh ${r.divergencia ? 'flag' : ''}" data-act="open-detalhe" data-id="${esc(r.id)}" type="button">
      <span class="plate">${esc(r.placa)}</span>
      <span class="veh-main"><strong>${esc(r.ident)}${r.divergencia ? '<span class="tag">Divergência</span>' : ''}</strong>
        <small>${dentro ? `No pátio desde ${fmtDH(r.entradaEm)}` : `${r.entradaEm ? fmtDH(r.entradaEm) : 'sem entrada'} → ${fmtDH(r.saidaEm)}`}</small></span></button>`;
  }).join('');
}
function renderDetalhe() {
  const r = S.det && S.det.rec; if (!r) return go('hist', {}, false);
  const row = (k, v) => v ? `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>` : '';
  $('#main').innerHTML = `
    <div class="backrow"><button class="back" data-act="back-hist" type="button">Voltar</button><h1>Registro</h1></div>
    <div class="summary"><span class="plate">${esc(r.placa)}</span><span class="veh-main"><strong>${esc(r.ident)}</strong><small>${esc(r.status || '')}</small></span></div>
    ${r.divergencia ? `<p class="notice bad"><b>Divergência registrada.</b> ${esc(r.obsSaida || '')}</p>` : ''}
    <dl class="info">
      ${row('Tipo', TIPOS[r.tipo] || r.tipo)}${row('Documento', r.documento)}
      ${row('Entrada', r.entradaEm ? fmtFull(r.entradaEm) : '')}${row('Vigilante (entrada)', r.vigEntrada && r.vigEntrada.nome ? `${r.vigEntrada.nome} (${r.vigEntrada.matricula})` : '')}
      ${row('Obs. entrada', r.obsEntrada)}
      ${row('Saída', r.saidaEm ? fmtFull(r.saidaEm) : '')}${row('Vigilante (saída)', r.vigSaida && r.vigSaida.nome ? `${r.vigSaida.nome} (${r.vigSaida.matricula})` : '')}
      ${r.liberacaoMaterial ? row('Liberação de material', 'Sim') : ''}
      ${!r.divergencia ? row('Obs. saída', r.obsSaida) : ''}
    </dl>
    <div id="detphotos"><button class="btn dark" data-act="det-photos" type="button">Ver fotos</button></div>`;
  $('#dock').innerHTML = tabs('hist');
}
async function loadDetPhotos() {
  const r = S.det.rec, box = $('#detphotos'); box.innerHTML = '<div class="empty">Carregando fotos…</div>';
  let ph = r.fotos ? { entrada: r.fotos, saida: {} } : null;
  if (!ph) { try { ph = await api('photos', { id: r.id }, 60000); } catch (e) { box.innerHTML = `<p class="notice bad">${esc(e.network ? 'Sem conexão. As fotos ficam no Drive e só aparecem com internet.' : e.message)}</p>`; return; } }
  S.det.photos = ph;
  let html = fotosDe(r.tipoVeiculo).map(([k, l]) => `<div class="pair"><h3>${l}</h3><div class="pair-grid">
      ${['entrada', 'saida'].map(w => ph[w] && ph[w][k]
        ? `<button class="frame" data-act="zoom-det" data-w="${w}" data-k="${k}" type="button"><img alt="" src="${ph[w][k]}"><span class="cap">${w === 'entrada' ? 'Entrada ' + fmtHora(r.entradaEm) : 'Saída ' + fmtHora(r.saidaEm)}</span></button>`
        : `<div class="frame">${w === 'entrada' ? 'Sem foto de entrada' : 'Sem foto de saída'}</div>`).join('')}
    </div></div>`).join('');
  if (ph.saida && ph.saida.liberacao) {
    html += `<div class="pair"><h3>Liberação de material</h3><div class="pair-grid">
      <div class="frame">Não se aplica</div>
      <button class="frame" data-act="zoom-det" data-w="saida" data-k="liberacao" type="button"><img alt="" src="${ph.saida.liberacao}"><span class="cap">Saída ${fmtHora(r.saidaEm)}</span></button>
    </div></div>`;
  }
  box.innerHTML = html;
}

/* ===================================================================
   Fotos: captura, compressão e carimbo de data/hora
   =================================================================== */
async function shrink(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w0 = bmp.width, h0 = bmp.height, sc = Math.min(1, 1280 / Math.max(w0, h0));
  const w = Math.round(w0 * sc), h = Math.round(h0 * sc);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(bmp, 0, 0, w, h); if (bmp.close) bmp.close();
  const placa = S.draft && (S.draft.placa || (S.draft.rec && S.draft.rec.placa)) || '';
  const txt = `${fmtFull(nowStr())} · ${CONFIG.PORTARIA}${placa ? ' · ' + placa : ''} · Vig. ${S.vig.matricula}`;
  const fs = Math.max(14, Math.round(Math.min(w, h) / 30)), p = Math.round(fs * .55), bh = fs + p * 2;
  x.fillStyle = 'rgba(27,26,25,.78)'; x.fillRect(0, h - bh, w, bh);
  x.font = `600 ${fs}px sans-serif`; x.textBaseline = 'middle'; x.fillStyle = '#F1D77C'; x.fillText(txt, p, h - bh / 2);
  return c.toDataURL('image/jpeg', 0.72);
}
async function onPhoto(input) {
  const file = input.files && input.files[0]; if (!file) return;
  const k = input.dataset.k;
  try {
    const data = await shrink(file); S.draft.fotos[k] = data;
    if (S.draft.kind === 'saida' && k !== 'liberacao') paintPair(k);
    else { const el = $(`.slot[data-k="${k}"]`); if (el) el.outerHTML = slotHTML(k, fotosLabel(S.draft, k), data); }
  } catch (e) { toast('Não foi possível processar a foto. Tente de novo.', true); }
  input.value = '';
}

/* Visualizador (toque para ampliar) */
function viewer(src, title) {
  removeViewer(true);
  const v = document.createElement('div'); v.className = 'viewer'; v.id = 'viewer';
  v.innerHTML = `<div class="viewer-bar"><strong>${esc(title)}</strong><button type="button" data-act="close-viewer">Fechar</button></div>
    <div class="viewer-body" id="vbody"><img alt="${esc(title)}" src="${src}"></div>`;
  document.body.appendChild(v); viewerOpen = true; history.pushState({ v: 1 }, '');
  $('#vbody').addEventListener('click', () => $('#vbody').classList.toggle('zoom'));
}
function removeViewer(silent) { const v = $('#viewer'); if (v) v.remove(); if (!silent) viewerOpen = false; }

/* ===================================================================
   Eventos
   =================================================================== */
const H = {
  login: doLogin,
  logout() { if (confirm('Trocar de vigilante?')) { localStorage.removeItem('vig'); S.vig = null; S.screen = 'home'; S.draft = null; render(); } },
  sync() { sync(true); },
  'tab-home'() { go('home', {}, false); },
  'tab-hist'() { S.hq = ''; go('hist', {}, false); },
  'new-entrada'() { S.draft = newDraft('entrada'); go('entrada'); },
  'new-avulsa'() { S.draft = newDraft('avulsa', { placa: norm(S.q).slice(0, 7) }); go('avulsa'); },
  'open-saida'(a) { openSaida(a.dataset.id); },
  cancel() { const d = S.draft; const sujo = d && (Object.keys(d.fotos).length || d.ident || d.placa || d.obs); if (!sujo || confirm('Descartar este registro?')) { S.draft = null; go('home', {}, false); } },
  tipo(a) { S.draft.tipo = a.dataset.v; document.querySelectorAll('[data-act=tipo]').forEach(b => b.setAttribute('aria-pressed', b === a)); paintIdFields(); },
  tipoveic(a) { S.draft.tipoVeic = a.dataset.v; renderForm(); },
  'ir-saida-dup'(a) { S.draft = null; openSaida(a.dataset.id); },
  'ack-dup'() { S.draft.dupAck = true; paintDupWarn(); },
  shoot(a) { const box = a.closest('.slot'); box.querySelector('input[type=file]').click(); },
  'zoom-draft'(a) { const k = a.dataset.k; const label = fotosLabel(S.draft, k); viewer(S.draft.fotos[k], label + (S.draft.kind === 'saida' ? ' · saída' : '')); },
  'zoom-entry'(a) { const k = a.dataset.k; viewer(S.draft.entryPhotos[k], fotosLabel(S.draft, k) + ' · entrada'); },
  'zoom-det'(a) { const k = a.dataset.k, w = a.dataset.w; viewer(S.det.photos[w][k], fotosLabel({ tipoVeic: S.det.rec.tipoVeiculo }, k) + (w === 'entrada' ? ' · entrada' : ' · saída')); },
  'close-viewer'() { history.back(); },
  'save-form': saveForm,
  'save-saida': saveSaida,
  diverg(a) { S.draft.diverg = a.dataset.v; renderSaidaKeep(); },
  liber(a) { S.draft.liber = a.dataset.v; renderSaidaKeep(); },
  'open-detalhe'(a) { const rec = S.hist.find(r => r.id === a.dataset.id) || [...S.open, ...S.done].find(r => r.id === a.dataset.id); S.det = { rec, photos: null }; go('detalhe'); },
  'back-hist'() { go('hist', {}, false); },
  'det-photos': loadDetPhotos
};
function renderSaidaKeep() { const y = window.scrollY; renderSaida(); window.scrollTo(0, y); }

document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (a && H[a.dataset.act]) H[a.dataset.act](a, e); });
document.addEventListener('change', e => { if (e.target.matches('input[type=file]')) onPhoto(e.target); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; paintList(); return; }
  if (t.id === 'hq') { S.hq = t.value; clearTimeout(hTimer); hTimer = setTimeout(loadHist, 350); return; }
  const f = t.dataset && t.dataset.bind; if (!f || !S.draft) return;
  if (f === 'placa') { t.value = t.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 7); }
  S.draft[f] = t.value;
  if (f === 'placa') paintDupWarn();
});

/* ===================================================================
   Início
   =================================================================== */
addEventListener('online', () => { paintSync(); sync(); });
addEventListener('offline', paintSync);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { sync(); if (S.screen === 'home') paintList(); } });
setInterval(() => { if (!document.hidden) { sync(); if (S.screen === 'home') paintList(); } }, 30000);

(async function init() {
  history.replaceState({ screen: 'home' }, '');
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  await loadLocal(); render();
  if (S.vig) { sync(); refreshOpen(); }
})();
</script>
